<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1f0f"/>
      <stop offset="100%" style="stop-color:#1a2e1a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#81c784"/>
    </linearGradient>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff8e8e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Organic curved background shapes -->
  <ellipse cx="200" cy="400" rx="300" ry="200" fill="rgba(76,175,80,0.05)" transform="rotate(-20, 200, 400)"/>
  <ellipse cx="650" cy="150" rx="250" ry="180" fill="rgba(76,175,80,0.04)" transform="rotate(15, 650, 150)"/>
  <!-- Instagram post mocks - 3 columns -->
  <!-- Post 1 - wellness quote -->
  <rect x="60" y="80" width="200" height="200" rx="4" fill="#1e3320" stroke="rgba(76,175,80,0.3)" stroke-width="1"/>
  <circle cx="160" cy="150" r="50" fill="rgba(76,175,80,0.2)"/>
  <text x="160" y="145" font-family="Georgia, serif" font-size="12" fill="#81c784" text-anchor="middle" font-style="italic">"Breathe.</text>
  <text x="160" y="162" font-family="Georgia, serif" font-size="12" fill="#81c784" text-anchor="middle" font-style="italic">Restore."</text>
  <text x="160" y="245" font-family="sans-serif" font-size="7" fill="#4caf50" text-anchor="middle" letter-spacing="2">@MINDSPACE</text>
  <!-- Post 2 - tip card -->
  <rect x="275" y="80" width="200" height="200" rx="4" fill="#fff" stroke="rgba(76,175,80,0.2)" stroke-width="1"/>
  <rect x="275" y="80" width="200" height="55" fill="url(#green)"/>
  <text x="375" y="105" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">WELLNESS TIP</text>
  <text x="375" y="120" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.8)" text-anchor="middle">#MindSpaceMonday</text>
  <text x="375" y="158" font-family="sans-serif" font-size="9" fill="#2d5a2d" text-anchor="middle">5-4-3-2-1</text>
  <text x="375" y="173" font-family="sans-serif" font-size="7" fill="#555" text-anchor="middle">Grounding Technique</text>
  <text x="375" y="193" font-family="sans-serif" font-size="7" fill="#888" text-anchor="middle">See 5 things · Hear 4 things</text>
  <text x="375" y="206" font-family="sans-serif" font-size="7" fill="#888" text-anchor="middle">Touch 3 · Smell 2 · Taste 1</text>
  <text x="375" y="245" font-family="sans-serif" font-size="7" fill="#4caf50" text-anchor="middle">mindspace.co</text>
  <!-- Post 3 - story style -->
  <rect x="490" y="80" width="200" height="200" rx="4" fill="#0f1f0f" stroke="url(#green)" stroke-width="2"/>
  <circle cx="590" cy="155" r="60" fill="rgba(76,175,80,0.1)" stroke="url(#green)" stroke-width="1" filter="url(#glow)"/>
  <text x="590" y="145" font-family="Georgia, serif" font-size="24" fill="#4caf50" text-anchor="middle" filter="url(#glow)">♡</text>
  <text x="590" y="168" font-family="sans-serif" font-size="7" fill="#81c784" text-anchor="middle">Self-Care First</text>
  <text x="590" y="240" font-family="sans-serif" font-size="7" fill="#555" text-anchor="middle">@mindspacewellness</text>
  <!-- Second row of posts -->
  <!-- Story format (vertical) -->
  <rect x="60" y="295" width="110" height="170" rx="4" fill="#1e3320"/>
  <rect x="60" y="295" width="110" height="5" fill="url(#green)"/>
  <text x="115" y="360" font-family="Georgia, serif" font-size="9" fill="#81c784" text-anchor="middle" font-style="italic">Daily</text>
  <text x="115" y="375" font-family="Georgia, serif" font-size="9" fill="#81c784" text-anchor="middle" font-style="italic">Affirmation</text>
  <!-- Reel thumbnail -->
  <rect x="182" y="295" width="110" height="170" rx="4" fill="#0d1f1a"/>
  <circle cx="237" cy="375" r="30" fill="rgba(76,175,80,0.3)" stroke="url(#green)" stroke-width="1"/>
  <polygon points="230,362 230,388 254,375" fill="#4caf50"/>
  <text x="237" y="450" font-family="sans-serif" font-size="6" fill="#555" text-anchor="middle">Reel</text>
  <!-- Color palette showcase -->
  <rect x="310" y="300" width="375" height="80" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(76,175,80,0.2)" stroke-width="1"/>
  <text x="320" y="322" font-family="monospace" font-size="7" fill="#4caf50" letter-spacing="1">BRAND PALETTE</text>
  <rect x="320" y="330" width="50" height="35" rx="2" fill="#4caf50"/>
  <rect x="378" y="330" width="50" height="35" rx="2" fill="#81c784"/>
  <rect x="436" y="330" width="50" height="35" rx="2" fill="#0f1f0f"/>
  <rect x="494" y="330" width="50" height="35" rx="2" fill="#fff"/>
  <rect x="552" y="330" width="50" height="35" rx="2" fill="#ff6b6b"/>
  <rect x="610" y="330" width="50" height="35" rx="2" fill="#f9f3e8"/>
  <!-- Hashtag strategy panel -->
  <rect x="310" y="395" width="375" height="65" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(76,175,80,0.15)" stroke-width="1"/>
  <text x="320" y="415" font-family="monospace" font-size="7" fill="#555" letter-spacing="1">#mindspace · #wellness · #selfcare · #mentalhealth</text>
  <text x="320" y="432" font-family="monospace" font-size="7" fill="#555">#meditation · #breathe · #dailyaffirmation · #healing</text>
  <text x="320" y="449" font-family="monospace" font-size="7" fill="#4caf50">#mindspaceapp · #wellnessjourney · #mindbodysoul</text>
  <!-- Label -->
  <text x="400" y="485" font-family="monospace" font-size="10" fill="#4caf50" text-anchor="middle" letter-spacing="2" opacity="0.8">SOCIAL MEDIA DESIGN / WELLNESS</text>
</svg>
