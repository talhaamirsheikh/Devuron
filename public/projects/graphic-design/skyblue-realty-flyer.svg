<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2a4a"/>
      <stop offset="100%" style="stop-color:#1a4a7a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4db9e0"/>
      <stop offset="100%" style="stop-color:#10475c"/>
    </linearGradient>
    <linearGradient id="flyer1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd"/>
      <stop offset="100%" style="stop-color:#d0ebf8"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Grid dots -->
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="#4db9e0" opacity="0.2"/>
  </pattern>
  <rect width="800" height="500" fill="url(#dots)"/>
  <!-- Main Flyer -->
  <rect x="100" y="60" width="240" height="380" rx="3" fill="url(#flyer1)" filter="url(#shadow)"/>
  <rect x="100" y="60" width="240" height="120" fill="url(#accent)"/>
  <!-- House icon -->
  <polygon points="220,80 260,110 260,155 180,155 180,110" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  <polygon points="215,80 265,108 175,108" fill="#4db9e0" opacity="0.6"/>
  <rect x="205" y="130" width="20" height="25" fill="#0a2a4a" opacity="0.7"/>
  <text x="220" y="178" font-family="Arial, sans-serif" font-size="14" fill="#0a2a4a" text-anchor="middle" font-weight="bold">SKYBLUE REALTY</text>
  <text x="220" y="194" font-family="Arial, sans-serif" font-size="8" fill="#1a4a7a" text-anchor="middle" letter-spacing="2">PREMIUM PROPERTIES</text>
  <line x1="120" y1="205" x2="320" y2="205" stroke="#4db9e0" stroke-width="1" opacity="0.5"/>
  <text x="220" y="225" font-family="Arial, sans-serif" font-size="10" fill="#0a2a4a" text-anchor="middle" font-weight="bold">FOR SALE</text>
  <text x="220" y="248" font-family="Arial, sans-serif" font-size="22" fill="#4db9e0" text-anchor="middle" font-weight="bold">$485,000</text>
  <text x="220" y="265" font-family="Arial, sans-serif" font-size="8" fill="#555" text-anchor="middle">4 BED · 3 BATH · 2,400 SQFT</text>
  <!-- Feature bars -->
  <rect x="120" y="280" width="80" height="20" rx="2" fill="#4db9e0" opacity="0.15"/>
  <text x="160" y="294" font-family="Arial, sans-serif" font-size="8" fill="#1a4a7a" text-anchor="middle">Pool</text>
  <rect x="210" y="280" width="80" height="20" rx="2" fill="#4db9e0" opacity="0.15"/>
  <text x="250" y="294" font-family="Arial, sans-serif" font-size="8" fill="#1a4a7a" text-anchor="middle">Garage</text>
  <rect x="120" y="308" width="170" height="1" fill="#4db9e0" opacity="0.3"/>
  <text x="220" y="335" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">📞 (555) 123-4567</text>
  <text x="220" y="352" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">skyblue@realty.com</text>
  <rect x="140" y="370" width="160" height="30" rx="2" fill="url(#accent)"/>
  <text x="220" y="390" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">SCHEDULE A VIEWING</text>
  <!-- Second flyer (rotated slightly) -->
  <rect x="390" y="80" width="220" height="340" rx="3" fill="url(#flyer1)" filter="url(#shadow)" transform="rotate(5, 500, 250)"/>
  <rect x="390" y="80" width="220" height="100" fill="#10475c" transform="rotate(5, 500, 250)"/>
  <text x="500" y="140" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" transform="rotate(5, 500, 250)">OPEN HOUSE</text>
  <text x="500" y="160" font-family="Arial, sans-serif" font-size="22" fill="#4db9e0" text-anchor="middle" font-weight="bold" transform="rotate(5, 500, 250)">SAT</text>
  <!-- Label -->
  <text x="400" y="478" font-family="monospace" font-size="10" fill="#4db9e0" text-anchor="middle" letter-spacing="2" opacity="0.8">FLYER DESIGN / REAL ESTATE</text>
</svg>
