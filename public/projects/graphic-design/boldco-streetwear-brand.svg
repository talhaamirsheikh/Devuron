<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cc0000"/>
      <stop offset="100%" style="stop-color:#ff2222"/>
    </linearGradient>
    <filter id="sharp"><feComposite in="SourceGraphic"/></filter>
    <filter id="shadow"><feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Subtle texture -->
  <pattern id="noise" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="2" height="2" fill="rgba(255,255,255,0.02)"/>
  </pattern>
  <rect width="800" height="500" fill="url(#noise)"/>
  <!-- Red accent line top -->
  <rect x="0" y="0" width="800" height="4" fill="url(#red)"/>
  <!-- Logo central display -->
  <rect x="200" y="120" width="400" height="260" rx="2" fill="#111" stroke="rgba(255,34,34,0.3)" stroke-width="1" filter="url(#shadow)"/>
  <!-- Brand mark: Bold B& -->
  <text x="400" y="240" font-family="Arial Black, sans-serif" font-size="72" fill="#fff" text-anchor="middle" font-weight="900" letter-spacing="-4">B&amp;Co</text>
  <rect x="220" y="255" width="360" height="3" fill="url(#red)"/>
  <text x="400" y="285" font-family="monospace" font-size="9" fill="#666" text-anchor="middle" letter-spacing="6">S T R E E T W E A R</text>
  <!-- Hoodie mockups on left -->
  <rect x="45" y="100" width="130" height="300" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1" filter="url(#shadow)"/>
  <!-- Hoodie silhouette simplified -->
  <path d="M70,150 L80,130 L115,120 L150,130 L160,150 L150,180 L75,180 Z" fill="#222" stroke="#333" stroke-width="1"/>
  <path d="M95,120 L100,140 L115,140 L130,120" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="75" y="180" width="75" height="120" rx="2" fill="#222"/>
  <!-- Print on hoodie -->
  <text x="112" y="230" font-family="Arial Black, sans-serif" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="900">B&amp;Co</text>
  <text x="112" y="350" font-family="sans-serif" font-size="7" fill="#555" text-anchor="middle">HOODIE — BLACK</text>
  <!-- Right side: Tag / hang tag design -->
  <rect x="625" y="100" width="130" height="300" rx="2" fill="#f5f5f5" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="690" cy="120" r="8" fill="none" stroke="#999" stroke-width="1.5"/>
  <line x1="690" y1="128" x2="690" y2="145" stroke="#999" stroke-width="1"/>
  <rect x="640" y="145" width="100" height="140" rx="2" fill="#fff" stroke="#eee" stroke-width="1"/>
  <rect x="640" y="145" width="100" height="5" fill="url(#red)"/>
  <text x="690" y="175" font-family="Arial Black, sans-serif" font-size="14" fill="#0a0a0a" text-anchor="middle" font-weight="900">B&amp;Co</text>
  <text x="690" y="192" font-family="monospace" font-size="6" fill="#cc0000" text-anchor="middle" letter-spacing="2">STREETWEAR</text>
  <line x1="650" y1="205" x2="730" y2="205" stroke="#eee" stroke-width="1"/>
  <text x="690" y="220" font-family="monospace" font-size="7" fill="#999" text-anchor="middle">SIZE: M</text>
  <text x="690" y="235" font-family="monospace" font-size="7" fill="#999" text-anchor="middle">$89.00 USD</text>
  <line x1="650" y1="248" x2="730" y2="248" stroke="#eee" stroke-width="1"/>
  <text x="690" y="264" font-family="monospace" font-size="5" fill="#bbb" text-anchor="middle">boldco.store</text>
  <rect x="645" y="300" width="90" height="20" rx="1" fill="#0a0a0a"/>
  <text x="690" y="314" font-family="monospace" font-size="5" fill="#fff" text-anchor="middle">MADE IN URBAN</text>
  <!-- Color swatches -->
  <text x="690" y="380" font-family="monospace" font-size="6" fill="#555" text-anchor="middle">COLORWAYS</text>
  <circle cx="655" cy="395" r="10" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
  <circle cx="680" cy="395" r="10" fill="#cc0000" stroke="#ff2222" stroke-width="1"/>
  <circle cx="705" cy="395" r="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <circle cx="730" cy="395" r="10" fill="#3a3a3a" stroke="#555" stroke-width="1"/>
  <!-- Label -->
  <text x="400" y="478" font-family="monospace" font-size="10" fill="#cc0000" text-anchor="middle" letter-spacing="2" opacity="0.8">BRAND IDENTITY / STREETWEAR</text>
</svg>
