<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a00"/>
      <stop offset="100%" style="stop-color:#2d1200"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#f0d080"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8ee"/>
      <stop offset="100%" style="stop-color:#fdeac8"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Decorative lines -->
  <line x1="0" y1="50" x2="800" y2="50" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <!-- Menu Card Left -->
  <rect x="80" y="80" width="260" height="340" rx="2" fill="url(#card1)" filter="url(#shadow)"/>
  <rect x="80" y="80" width="260" height="60" fill="#8B1A1A"/>
  <text x="210" y="118" font-family="Georgia, serif" font-size="18" fill="#f0d080" text-anchor="middle" font-style="italic">UrbanEats</text>
  <text x="210" y="134" font-family="Georgia, serif" font-size="9" fill="#fdeac8" text-anchor="middle" letter-spacing="3">RESTAURANT &amp; BAR</text>
  <!-- Menu items -->
  <line x1="100" y1="165" x2="320" y2="165" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
  <text x="100" y="185" font-family="Georgia, serif" font-size="11" fill="#3d2000" font-weight="bold">STARTERS</text>
  <text x="100" y="202" font-family="Arial, sans-serif" font-size="9" fill="#5a3000">Truffle Arancini........................$14</text>
  <text x="100" y="216" font-family="Arial, sans-serif" font-size="9" fill="#5a3000">Burrata &amp; Heirloom Tomato.........$16</text>
  <text x="100" y="230" font-family="Arial, sans-serif" font-size="9" fill="#5a3000">Smoked Salmon Blini.................$18</text>
  <line x1="100" y1="245" x2="320" y2="245" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
  <text x="100" y="265" font-family="Georgia, serif" font-size="11" fill="#3d2000" font-weight="bold">MAINS</text>
  <text x="100" y="282" font-family="Arial, sans-serif" font-size="9" fill="#5a3000">Wagyu Beef Burger.....................$28</text>
  <text x="100" y="296" font-family="Arial, sans-serif" font-size="9" fill="#5a3000">Pan-Seared Sea Bass...................$32</text>
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="9" fill="#5a3000">Wild Mushroom Risotto..............$24</text>
  <line x1="100" y1="325" x2="320" y2="325" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
  <text x="210" y="395" font-family="Georgia, serif" font-size="8" fill="#8B1A1A" text-anchor="middle" font-style="italic">urbaneats.co</text>
  <!-- Menu Card Right -->
  <rect x="380" y="100" width="240" height="300" rx="2" fill="url(#card1)" filter="url(#shadow)"/>
  <rect x="380" y="100" width="240" height="8" fill="url(#gold)"/>
  <rect x="380" y="392" width="240" height="8" fill="url(#gold)"/>
  <!-- Plate illustration -->
  <circle cx="500" cy="230" r="65" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.4"/>
  <circle cx="500" cy="230" r="55" fill="#f5e6c0" opacity="0.6"/>
  <ellipse cx="500" cy="235" rx="35" ry="20" fill="#8B1A1A" opacity="0.2"/>
  <circle cx="500" cy="225" r="18" fill="#c9a84c" opacity="0.4"/>
  <text x="500" y="315" font-family="Georgia, serif" font-size="10" fill="#3d2000" text-anchor="middle" font-style="italic">Chef's Special</text>
  <!-- Label -->
  <text x="210" y="470" font-family="monospace" font-size="10" fill="#f0d080" text-anchor="middle" letter-spacing="2" opacity="0.8">MENU DESIGN / PRINT</text>
</svg>
