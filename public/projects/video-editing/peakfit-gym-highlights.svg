<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080010"/>
      <stop offset="100%" style="stop-color:#0f0020"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4db9e0"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="100" cy="50" r="1" fill="rgba(255,255,255,0.5)"/>
  <circle cx="250" cy="30" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="600" cy="80" r="1" fill="rgba(255,255,255,0.6)"/>
  <circle cx="750" cy="40" r="1" fill="rgba(255,255,255,0.3)"/>
  <circle cx="500" cy="20" r="0.8" fill="rgba(255,255,255,0.5)"/>
  <!-- Central gym imagery - motion graphic style -->
  <!-- Silhouette in circular frame -->
  <circle cx="400" cy="220" r="140" fill="rgba(124,58,237,0.1)" stroke="url(#purple)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="400" cy="220" r="110" fill="rgba(77,185,224,0.05)" stroke="rgba(77,185,224,0.3)" stroke-width="1"/>
  <!-- Gym silhouette: person lifting -->
  <circle cx="400" cy="155" r="18" fill="rgba(124,58,237,0.6)"/>
  <path d="M385,173 L380,210 L388,230 L400,215 L412,230 L420,210 L415,173 Z" fill="rgba(124,58,237,0.5)"/>
  <!-- Barbell arms -->
  <line x1="360" y1="190" x2="440" y2="190" stroke="url(#purple)" stroke-width="4" filter="url(#glow2)"/>
  <rect x="345" y="182" width="15" height="16" rx="3" fill="url(#blue)"/>
  <rect x="440" y="182" width="15" height="16" rx="3" fill="url(#blue)"/>
  <!-- Energy burst lines -->
  <line x1="400" y1="80" x2="400" y2="50" stroke="url(#purple)" stroke-width="2" opacity="0.5" filter="url(#glow2)"/>
  <line x1="460" y1="100" x2="490" y2="75" stroke="url(#purple)" stroke-width="1.5" opacity="0.4"/>
  <line x1="340" y1="100" x2="310" y2="75" stroke="url(#purple)" stroke-width="1.5" opacity="0.4"/>
  <line x1="490" y1="160" x2="530" y2="150" stroke="url(#blue)" stroke-width="1.5" opacity="0.4"/>
  <line x1="310" y1="160" x2="270" y2="150" stroke="url(#blue)" stroke-width="1.5" opacity="0.4"/>
  <!-- Stats animated overlays -->
  <rect x="90" y="140" width="160" height="70" rx="4" fill="rgba(0,0,0,0.6)" stroke="url(#purple)" stroke-width="1"/>
  <text x="100" y="163" font-family="monospace" font-size="7" fill="#a855f7" letter-spacing="1">THIS WEEK</text>
  <text x="100" y="183" font-family="Arial Black, sans-serif" font-size="18" fill="#fff" font-weight="900">5 SESSIONS</text>
  <text x="100" y="200" font-family="monospace" font-size="7" fill="#4db9e0">▲ 25% vs last week</text>
  <rect x="555" y="140" width="160" height="70" rx="4" fill="rgba(0,0,0,0.6)" stroke="url(#blue)" stroke-width="1"/>
  <text x="565" y="163" font-family="monospace" font-size="7" fill="#4db9e0" letter-spacing="1">TOTAL BURNED</text>
  <text x="565" y="183" font-family="Arial Black, sans-serif" font-size="18" fill="#fff" font-weight="900">3,240</text>
  <text x="565" y="200" font-family="monospace" font-size="7" fill="#a855f7">KCAL THIS MONTH</text>
  <!-- Lower third graphic -->
  <rect x="60" y="355" width="680" height="55" rx="3" fill="rgba(0,0,0,0.7)" stroke="url(#blue)" stroke-width="1"/>
  <rect x="60" y="355" width="4" height="55" fill="url(#purple)"/>
  <text x="80" y="376" font-family="Arial Black, sans-serif" font-size="12" fill="#fff" font-weight="900">PEAKFIT GYM HIGHLIGHTS</text>
  <text x="80" y="395" font-family="monospace" font-size="8" fill="#a855f7">CLIENT REEL · 2025 SEASON</text>
  <text x="680" y="390" font-family="monospace" font-size="8" fill="#4db9e0" text-anchor="end">AFTER EFFECTS + PREMIERE PRO</text>
  <!-- Playbar timeline at bottom -->
  <rect x="60" y="425" width="680" height="30" rx="3" fill="rgba(0,0,0,0.5)"/>
  <rect x="60" y="425" width="300" height="30" rx="3" fill="rgba(124,58,237,0.2)"/>
  <!-- Timeline marks -->
  <rect x="75" y="433" width="2" height="14" fill="rgba(255,255,255,0.2)"/>
  <rect x="115" y="433" width="2" height="14" fill="rgba(255,255,255,0.2)"/>
  <rect x="155" y="433" width="2" height="14" fill="rgba(255,255,255,0.2)"/>
  <rect x="195" y="433" width="2" height="14" fill="rgba(255,255,255,0.2)"/>
  <rect x="235" y="433" width="2" height="14" fill="rgba(255,255,255,0.2)"/>
  <circle cx="360" cy="440" r="8" fill="url(#purple)" filter="url(#glow2)"/>
  <text x="400" y="488" font-family="monospace" font-size="10" fill="#a855f7" text-anchor="middle" letter-spacing="2" opacity="0.8">MOTION GRAPHICS / GYM REEL</text>
</svg>
